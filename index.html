<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤 Weather Information Dashboard</h1>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name"
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">City Name</h2>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather Condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- m/s</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">-- °C</strong>
                </div>

                <div class="detail">
                    <span>☁️</span>
                    <p>Pressure</p>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
